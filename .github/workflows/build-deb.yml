name: Build Debian Package & Create Release

on:
  push:
    branches: [main, master, dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debian:
    name: Build & Package (.deb)
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none

      - name: Fast Parallel Submodules & Docker Pull
        run: |
          # Configure Docker for 20 concurrent layer downloads
          sudo bash -c 'cat > /etc/docker/daemon.json <<EOF
          {
            "max-concurrent-downloads": 20,
            "max-concurrent-uploads": 20
          }
          EOF'
          sudo systemctl restart docker

          # Start Docker pull in background
          docker pull ghcr.io/telegramdesktop/tdesktop/centos_env:latest &
          DOCKER_PID=$!

          # Parallel fetch 35+ submodules (shallow, 8 concurrent jobs)
          git submodule update --init --recursive --depth=1 --recommend-shallow --jobs 8

          # Wait for Docker pull
          wait $DOCKER_PID
          echo "All submodules and Docker environment ready!"

          # Safeguard: ensure protobuf is not required by cld3 if legacy submodule is used
          if [ -f "cmake/external/cld3/CMakeLists.txt" ]; then
            sed -i 's/find_package(protobuf REQUIRED CONFIG)/# find_package(protobuf REQUIRED CONFIG)/g' cmake/external/cld3/CMakeLists.txt
          fi

      - name: Cache ccache objects
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.ref_name }}-
            ccache-${{ runner.os }}-

      - name: Configure ccache & Build
        env:
          TDESKTOP_API_ID: ${{ secrets.TDESKTOP_API_ID }}
          TDESKTOP_API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          mkdir -p ~/.ccache
          cat > ~/.ccache/ccache.conf << 'EOF'
          max_size = 8G
          compression = true
          compression_level = 1
          hash_dir = false
          direct_mode = true
          sloppiness = file_macro,time_macros,include_file_mtime,include_file_ctime,pch_defines,locale
          EOF

          API_ID="${TDESKTOP_API_ID:-2040}"
          API_HASH="${TDESKTOP_API_HASH:-b18441a1ff607e10a989891a5462e627}"
          NPROC=$(nproc)
          echo "Building with $NPROC parallel jobs"

          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -v "$PWD:/usr/src/tdesktop" \
            -v "$HOME/.ccache:/tmp/.ccache" \
            -e CONFIG=Release \
            -e CCACHE_DIR=/tmp/.ccache \
            -e CCACHE_MAXSIZE=8G \
            -e CCACHE_SLOPPINESS=file_macro,time_macros,include_file_mtime,include_file_ctime,pch_defines,locale \
            -e CCACHE_COMPRESS=1 \
            -e CCACHE_COMPRESSLEVEL=1 \
            -e CCACHE_NOHASHDIR=1 \
            -e CCACHE_BASEDIR=/usr/src/tdesktop \
            -e CMAKE_BUILD_PARALLEL_LEVEL="$NPROC" \
            -e MAKEFLAGS="-j$NPROC" \
            ghcr.io/telegramdesktop/tdesktop/centos_env:latest \
            /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
            -D TDESKTOP_API_ID="$API_ID" \
            -D TDESKTOP_API_HASH="$API_HASH" \
            -D CMAKE_CXX_FLAGS="-Wno-error"

      - name: ccache stats
        if: always()
        run: |
          docker run --rm \
            -v "$HOME/.ccache:/tmp/.ccache" \
            -e CCACHE_DIR=/tmp/.ccache \
            ghcr.io/telegramdesktop/tdesktop/centos_env:latest \
            ccache -s || true

      - name: Package, Release & Deploy APT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          REPO_OWNER="${GITHUB_REPOSITORY%/*}"
          PAGES_URL="https://${REPO_OWNER}.github.io/${REPO_NAME}"
          TIMESTAMP=$(date +'%Y.%m.%d-%H%M')
          VERSION=$(date +'%Y.%m.%d.%H%M')
          TAG="v${TIMESTAMP}"
          DATE_STR=$(date +'%Y-%m-%d %H:%M:%S UTC')
          PKG_NAME="ashu-desktop_${VERSION}_amd64"
          PKG_NAME_X64="ashu-desktop_${VERSION}_x64"
          PKG_NAME_ARM64="ashu-desktop_${VERSION}_arm64"
          PKG_DIR="build_deb/${PKG_NAME}"
          PKG_DIR_ARM64="build_deb/${PKG_NAME_ARM64}"

          mkdir -p "${PKG_DIR}/DEBIAN" "${PKG_DIR}/usr/bin" \
            "${PKG_DIR}/usr/share/applications" \
            "${PKG_DIR}/usr/share/icons/hicolor/512x512/apps"

          mkdir -p "${PKG_DIR_ARM64}/DEBIAN" "${PKG_DIR_ARM64}/usr/bin" \
            "${PKG_DIR_ARM64}/usr/lib/ashu-desktop" \
            "${PKG_DIR_ARM64}/usr/share/applications" \
            "${PKG_DIR_ARM64}/usr/share/icons/hicolor/512x512/apps"

          BIN_PATH=""
          for candidate in out/Release/AshuGram out/Release/AyuGram out/Release/Telegram out/AshuGram out/AyuGram out/Telegram out/Release/ashu-desktop; do
            [ -f "$candidate" ] && BIN_PATH="$candidate" && break
          done
          [ -z "$BIN_PATH" ] && BIN_PATH=$(find out -type f \( -name "AshuGram" -o -name "AyuGram" -o -name "Telegram" \) | head -n 1)
          [ -z "$BIN_PATH" ] || [ ! -f "$BIN_PATH" ] && echo "Error: binary not found" && exit 1

          echo "Found binary: ${BIN_PATH}"
          strip "$BIN_PATH" || true

          # --- amd64 Package ---
          cp "$BIN_PATH" "${PKG_DIR}/usr/bin/ashu-desktop"
          chmod +x "${PKG_DIR}/usr/bin/ashu-desktop"
          ln -sf ashu-desktop "${PKG_DIR}/usr/bin/AshuGram"
          ln -sf ashu-desktop "${PKG_DIR}/usr/bin/ayugram-desktop"
          ln -sf ashu-desktop "${PKG_DIR}/usr/bin/AyuGram"

          cat > "${PKG_DIR}/DEBIAN/postinst" << SCRIPT
          #!/bin/bash
          APT_SOURCE="/etc/apt/sources.list.d/ashu-desktop.list"
          echo "deb [trusted=yes] ${PAGES_URL}/apt ./" > "\$APT_SOURCE"
          echo ""
          echo "Ashu Desktop installed!"
          echo "APT source added. Updates via: sudo apt update && sudo apt upgrade"
          echo ""
          which gtk-update-icon-cache >/dev/null 2>&1 && gtk-update-icon-cache -f /usr/share/icons/hicolor || true
          which update-desktop-database >/dev/null 2>&1 && update-desktop-database -q /usr/share/applications || true
          SCRIPT
          chmod 755 "${PKG_DIR}/DEBIAN/postinst"

          cat > "${PKG_DIR}/DEBIAN/prerm" << 'SCRIPT'
          #!/bin/bash
          rm -f /etc/apt/sources.list.d/ashu-desktop.list
          which gtk-update-icon-cache >/dev/null 2>&1 && gtk-update-icon-cache -f /usr/share/icons/hicolor || true
          which update-desktop-database >/dev/null 2>&1 && update-desktop-database -q /usr/share/applications || true
          SCRIPT
          chmod 755 "${PKG_DIR}/DEBIAN/prerm"

          if [ -f "lib/xdg/com.ashu.desktop.desktop" ]; then
            cp "lib/xdg/com.ashu.desktop.desktop" "${PKG_DIR}/usr/share/applications/com.ashu.desktop.desktop"
            sed -i 's|Exec=env DESKTOPINTEGRATION=1 AshuGram -- %U|Exec=ashu-desktop -- %U|g' "${PKG_DIR}/usr/share/applications/com.ashu.desktop.desktop"
            sed -i 's|TryExec=AshuGram|TryExec=ashu-desktop|g' "${PKG_DIR}/usr/share/applications/com.ashu.desktop.desktop"
          fi

          if [ -f "Telegram/Resources/art/icon512.png" ]; then
            cp "Telegram/Resources/art/icon512.png" "${PKG_DIR}/usr/share/icons/hicolor/512x512/apps/com.ashu.desktop.png"
          fi

          {
            echo "Package: ashu-desktop"
            echo "Version: ${VERSION}"
            echo "Architecture: amd64"
            echo "Maintainer: Ashu <support@ashu.dev>"
            echo "Section: net"
            echo "Priority: optional"
            echo "Depends: libc6 (>= 2.34), libgcc-s1, libstdc++6, libxcb1, libx11-6, libgl1, libglib2.0-0"
            echo "Description: Ashu Desktop client for Linux"
            echo " Desktop version of Ashu - feature-packed Telegram client."
            echo " Auto-updates via APT (GitHub Pages repository)."
          } > "${PKG_DIR}/DEBIAN/control"

          dpkg-deb --build --root-owner-group "${PKG_DIR}"
          mv "build_deb/${PKG_NAME}.deb" "./${PKG_NAME}.deb"
          cp "./${PKG_NAME}.deb" "./${PKG_NAME_X64}.deb"

          # --- arm64 Package ---
          cp "$BIN_PATH" "${PKG_DIR_ARM64}/usr/lib/ashu-desktop/ashu-desktop"
          chmod 755 "${PKG_DIR_ARM64}/usr/lib/ashu-desktop/ashu-desktop"

          cat > "${PKG_DIR_ARM64}/usr/bin/ashu-desktop" << 'RUNNER'
          #!/bin/bash
          EXEC_BIN="/usr/lib/ashu-desktop/ashu-desktop"
          if [ ! -f "$EXEC_BIN" ]; then
            echo "Error: Binary not found at $EXEC_BIN" >&2
            exit 1
          fi

          if command -v qemu-x86_64 >/dev/null 2>&1; then
            exec qemu-x86_64 "$EXEC_BIN" "$@"
          elif command -v qemu-x86_64-static >/dev/null 2>&1; then
            exec qemu-x86_64-static "$EXEC_BIN" "$@"
          elif command -v box64 >/dev/null 2>&1; then
            exec box64 "$EXEC_BIN" "$@"
          else
            echo "Error: No x86_64 runtime found on this ARM64 system." >&2
            echo "Please install qemu-user: sudo apt-get install -y qemu-user" >&2
            exit 1
          fi
          RUNNER
          chmod 755 "${PKG_DIR_ARM64}/usr/bin/ashu-desktop"

          ln -sf ashu-desktop "${PKG_DIR_ARM64}/usr/bin/AshuGram"
          ln -sf ashu-desktop "${PKG_DIR_ARM64}/usr/bin/ayugram-desktop"
          ln -sf ashu-desktop "${PKG_DIR_ARM64}/usr/bin/AyuGram"

          if [ -f "lib/xdg/com.ashu.desktop.desktop" ]; then
            cp "lib/xdg/com.ashu.desktop.desktop" "${PKG_DIR_ARM64}/usr/share/applications/com.ashu.desktop.desktop"
            sed -i 's|Exec=env DESKTOPINTEGRATION=1 AshuGram -- %U|Exec=ashu-desktop -- %U|g' "${PKG_DIR_ARM64}/usr/share/applications/com.ashu.desktop.desktop"
            sed -i 's|TryExec=AshuGram|TryExec=ashu-desktop|g' "${PKG_DIR_ARM64}/usr/share/applications/com.ashu.desktop.desktop"
          fi

          if [ -f "Telegram/Resources/art/icon512.png" ]; then
            cp "Telegram/Resources/art/icon512.png" "${PKG_DIR_ARM64}/usr/share/icons/hicolor/512x512/apps/com.ashu.desktop.png"
          fi

          cat > "${PKG_DIR_ARM64}/DEBIAN/postinst" << SCRIPT
          #!/bin/bash
          APT_SOURCE="/etc/apt/sources.list.d/ashu-desktop.list"
          echo "deb [trusted=yes] ${PAGES_URL}/apt ./" > "\$APT_SOURCE"
          echo ""
          echo "Ashu Desktop (ARM64) installed!"
          echo "APT source added. Updates via: sudo apt update && sudo apt upgrade"
          echo ""
          which gtk-update-icon-cache >/dev/null 2>&1 && gtk-update-icon-cache -f /usr/share/icons/hicolor || true
          which update-desktop-database >/dev/null 2>&1 && update-desktop-database -q /usr/share/applications || true
          SCRIPT
          chmod 755 "${PKG_DIR_ARM64}/DEBIAN/postinst"

          cat > "${PKG_DIR_ARM64}/DEBIAN/prerm" << 'SCRIPT'
          #!/bin/bash
          rm -f /etc/apt/sources.list.d/ashu-desktop.list
          which gtk-update-icon-cache >/dev/null 2>&1 && gtk-update-icon-cache -f /usr/share/icons/hicolor || true
          which update-desktop-database >/dev/null 2>&1 && update-desktop-database -q /usr/share/applications || true
          SCRIPT
          chmod 755 "${PKG_DIR_ARM64}/DEBIAN/prerm"

          {
            echo "Package: ashu-desktop"
            echo "Version: ${VERSION}"
            echo "Architecture: arm64"
            echo "Maintainer: Ashu <support@ashu.dev>"
            echo "Section: net"
            echo "Priority: optional"
            echo "Depends: qemu-user | qemu-user-static, libc6:amd64, libglib2.0-0t64:amd64 | libglib2.0-0:amd64, libgtk-3-0t64:amd64 | libgtk-3-0:amd64"
            echo "Recommends: libx11-xcb1:amd64, libgl1:amd64, libpulse0:amd64, libasound2t64:amd64 | libasound2:amd64"
            echo "Description: Ashu Desktop client for Linux (arm64)"
            echo " Desktop version of Ashu - feature-packed Telegram client."
            echo " Configured to run on ARM64 using high-performance user emulation."
            echo " Auto-updates via APT (GitHub Pages repository)."
          } > "${PKG_DIR_ARM64}/DEBIAN/control"

          dpkg-deb --build --root-owner-group "${PKG_DIR_ARM64}"
          mv "build_deb/${PKG_NAME_ARM64}.deb" "./${PKG_NAME_ARM64}.deb"

          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "pkg_file=${PKG_NAME}.deb" >> $GITHUB_OUTPUT
          echo "pkg_file_amd64=${PKG_NAME}.deb" >> $GITHUB_OUTPUT
          echo "pkg_file_x64=${PKG_NAME_X64}.deb" >> $GITHUB_OUTPUT
          echo "pkg_file_arm64=${PKG_NAME_ARM64}.deb" >> $GITHUB_OUTPUT
          echo "date_str=${DATE_STR}" >> $GITHUB_OUTPUT
        id: build

      - name: Upload amd64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.pkg_file_amd64 }}
          path: ${{ steps.build.outputs.pkg_file_amd64 }}

      - name: Upload x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.pkg_file_x64 }}
          path: ${{ steps.build.outputs.pkg_file_x64 }}

      - name: Upload arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.pkg_file_arm64 }}
          path: ${{ steps.build.outputs.pkg_file_arm64 }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.build.outputs.tag }}
          name: Ashu Desktop Debian Build (${{ steps.build.outputs.date_str }})
          body: |
            Automated Linux Debian package build for Ashu Desktop.

            - **Release Tag:** `${{ steps.build.outputs.tag }}`
            - **Package Files:**
              - `${{ steps.build.outputs.pkg_file_amd64 }}`
              - `${{ steps.build.outputs.pkg_file_arm64 }}`
              - `${{ steps.build.outputs.pkg_file_x64 }}`
            - **Built on:** `${{ steps.build.outputs.date_str }}`

            ### Quick Install (One-Line Command)
            Auto-detects architecture (amd64 / arm64) and sets up auto-updates via APT:
            ```bash
            curl -fsSL https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/install.sh | sudo bash
            ```
            Or via raw GitHub:
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/dev/install.sh | sudo bash
            ```

            ### Manual Install & Auto-Update
            ```bash
            sudo dpkg -i ${{ steps.build.outputs.pkg_file_amd64 }}
            # or on ARM64:
            sudo dpkg -i ${{ steps.build.outputs.pkg_file_arm64 }}
            ```
            After install, updates come through APT:
            ```bash
            sudo apt update && sudo apt upgrade
            ```
          files: |
            ${{ steps.build.outputs.pkg_file_amd64 }}
            ${{ steps.build.outputs.pkg_file_arm64 }}
            ${{ steps.build.outputs.pkg_file_x64 }}
            install.sh
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy APT repo & Installer to GitHub Pages
        run: |
          sudo apt-get install -y dpkg-dev apt-utils
          mkdir -p gh-pages-dist/apt
          cp "${{ steps.build.outputs.pkg_file_amd64 }}" gh-pages-dist/apt/
          cp "${{ steps.build.outputs.pkg_file_arm64 }}" gh-pages-dist/apt/
          cp "${{ steps.build.outputs.pkg_file_amd64 }}" gh-pages-dist/
          cp "${{ steps.build.outputs.pkg_file_arm64 }}" gh-pages-dist/
          cp "${{ steps.build.outputs.pkg_file_x64 }}" gh-pages-dist/
          cd gh-pages-dist/apt
          dpkg-scanpackages --multiversion . /dev/null > Packages
          gzip -k -f Packages
          apt-ftparchive release . > Release
          cd ../..
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          REPO_OWNER="${GITHUB_REPOSITORY%/*}"
          cp install.sh gh-pages-dist/install.sh
          sed -i "s|REPO_OWNER=.*|REPO_OWNER=\"${REPO_OWNER}\"|g" gh-pages-dist/install.sh
          sed -i "s|REPO_NAME=.*|REPO_NAME=\"${REPO_NAME}\"|g" gh-pages-dist/install.sh
          cp gh-pages-dist/install.sh gh-pages-dist/apt/install.sh
          touch gh-pages-dist/.nojekyll

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages-dist
          keep_files: false
