name: Build Debian Package & Create Release

on:
  push:
    branches: [main, master, dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debian:
    name: Build & Package (.deb)
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none

      - name: Fast Parallel Submodules & Docker Pull
        run: |
          # Configure Docker for 20 concurrent layer downloads
          sudo bash -c 'cat > /etc/docker/daemon.json <<EOF
          {
            "max-concurrent-downloads": 20,
            "max-concurrent-uploads": 20
          }
          EOF'
          sudo systemctl restart docker

          # Start Docker pull in background
          docker pull ghcr.io/telegramdesktop/tdesktop/centos_env:latest &
          DOCKER_PID=$!

          # Parallel fetch 35+ submodules (shallow, 8 concurrent jobs)
          git submodule update --init --recursive --depth=1 --recommend-shallow --jobs 8

          # Wait for Docker pull
          wait $DOCKER_PID
          echo "All submodules and Docker environment ready!"

      - name: Cache ccache objects
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.ref_name }}-
            ccache-${{ runner.os }}-

      - name: Cache CMake build tree
        uses: actions/cache@v4
        with:
          path: out
          key: cmake-out-${{ runner.os }}-${{ hashFiles('Telegram/CMakeLists.txt', 'cmake/**') }}
          restore-keys: |
            cmake-out-${{ runner.os }}-

      - name: Configure ccache & Build
        env:
          TDESKTOP_API_ID: ${{ secrets.TDESKTOP_API_ID }}
          TDESKTOP_API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          mkdir -p ~/.ccache
          cat > ~/.ccache/ccache.conf << 'EOF'
          max_size = 8G
          compression = true
          compression_level = 1
          hash_dir = false
          direct_mode = true
          sloppiness = file_macro,time_macros,include_file_mtime,include_file_ctime,pch_defines,locale
          EOF

          API_ID="${TDESKTOP_API_ID:-2040}"
          API_HASH="${TDESKTOP_API_HASH:-b18441a1ff607e10a989891a5462e627}"
          NPROC=$(nproc)
          echo "Building with $NPROC parallel jobs"

          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -v "$PWD:/usr/src/tdesktop" \
            -v "$HOME/.ccache:/tmp/.ccache" \
            -e CONFIG=Release \
            -e CCACHE_DIR=/tmp/.ccache \
            -e CCACHE_MAXSIZE=8G \
            -e CCACHE_SLOPPINESS=file_macro,time_macros,include_file_mtime,include_file_ctime,pch_defines,locale \
            -e CCACHE_COMPRESS=1 \
            -e CCACHE_COMPRESSLEVEL=1 \
            -e CCACHE_NOHASHDIR=1 \
            -e CCACHE_BASEDIR=/usr/src/tdesktop \
            -e CMAKE_BUILD_PARALLEL_LEVEL="$NPROC" \
            -e MAKEFLAGS="-j$NPROC" \
            ghcr.io/telegramdesktop/tdesktop/centos_env:latest \
            /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
            -D TDESKTOP_API_ID="$API_ID" \
            -D TDESKTOP_API_HASH="$API_HASH" \
            -D CMAKE_CXX_FLAGS="-Wno-error"

      - name: ccache stats
        if: always()
        run: |
          docker run --rm \
            -v "$HOME/.ccache:/tmp/.ccache" \
            -e CCACHE_DIR=/tmp/.ccache \
            ghcr.io/telegramdesktop/tdesktop/centos_env:latest \
            ccache -s || true

      - name: Package, Release & Deploy APT
        env:
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TIMESTAMP=$(date +'%Y.%m.%d-%H%M')
          VERSION=$(date +'%Y.%m.%d.%H%M')
          TAG="v${TIMESTAMP}"
          DATE_STR=$(date +'%Y-%m-%d %H:%M:%S UTC')
          PKG_NAME="ashu-desktop_${VERSION}_amd64"
          PKG_DIR="build_deb/${PKG_NAME}"

          mkdir -p "${PKG_DIR}/DEBIAN" "${PKG_DIR}/usr/bin" \
            "${PKG_DIR}/usr/share/applications" \
            "${PKG_DIR}/usr/share/icons/hicolor/512x512/apps"

          BIN_PATH=""
          for candidate in out/Release/AyuGram out/Release/Telegram out/AyuGram out/Telegram out/Release/ashu-desktop; do
            [ -f "$candidate" ] && BIN_PATH="$candidate" && break
          done
          [ -z "$BIN_PATH" ] && BIN_PATH=$(find out -type f \( -name "AyuGram" -o -name "Telegram" \) | head -n 1)
          [ -z "$BIN_PATH" ] || [ ! -f "$BIN_PATH" ] && echo "Error: binary not found" && exit 1

          echo "Found binary: ${BIN_PATH}"
          strip "$BIN_PATH" || true
          cp "$BIN_PATH" "${PKG_DIR}/usr/bin/ashu-desktop"
          chmod +x "${PKG_DIR}/usr/bin/ashu-desktop"
          ln -sf ashu-desktop "${PKG_DIR}/usr/bin/ayugram-desktop"
          ln -sf ashu-desktop "${PKG_DIR}/usr/bin/AyuGram"

          cat > "${PKG_DIR}/DEBIAN/postinst" << SCRIPT
          #!/bin/bash
          APT_SOURCE="/etc/apt/sources.list.d/ashu-desktop.list"
          echo "deb [trusted=yes] ${PAGES_URL}/apt ./" > "\$APT_SOURCE"
          echo ""
          echo "Ashu Desktop installed!"
          echo "APT source added. Updates via: sudo apt update && sudo apt upgrade"
          echo ""
          which gtk-update-icon-cache >/dev/null 2>&1 && gtk-update-icon-cache -f /usr/share/icons/hicolor || true
          which update-desktop-database >/dev/null 2>&1 && update-desktop-database -q /usr/share/applications || true
          SCRIPT
          chmod 755 "${PKG_DIR}/DEBIAN/postinst"

          cat > "${PKG_DIR}/DEBIAN/prerm" << 'SCRIPT'
          #!/bin/bash
          rm -f /etc/apt/sources.list.d/ashu-desktop.list
          which gtk-update-icon-cache >/dev/null 2>&1 && gtk-update-icon-cache -f /usr/share/icons/hicolor || true
          which update-desktop-database >/dev/null 2>&1 && update-desktop-database -q /usr/share/applications || true
          SCRIPT
          chmod 755 "${PKG_DIR}/DEBIAN/prerm"

          if [ -f "lib/xdg/com.ayugram.desktop.desktop" ]; then
            # Install as com.ayugram.desktop.desktop
            cp "lib/xdg/com.ayugram.desktop.desktop" "${PKG_DIR}/usr/share/applications/com.ayugram.desktop.desktop"
            sed -i 's|Exec=env DESKTOPINTEGRATION=1 AyuGram -- %U|Exec=ashu-desktop -- %U|g' "${PKG_DIR}/usr/share/applications/com.ayugram.desktop.desktop"
            sed -i 's|TryExec=AyuGram|TryExec=ashu-desktop|g' "${PKG_DIR}/usr/share/applications/com.ayugram.desktop.desktop"

            # Also install as com.ashu.desktop.desktop for ashu-desktop package compatibility
            cp "lib/xdg/com.ayugram.desktop.desktop" "${PKG_DIR}/usr/share/applications/com.ashu.desktop.desktop"
            sed -i 's|Exec=env DESKTOPINTEGRATION=1 AyuGram -- %U|Exec=ashu-desktop -- %U|g' "${PKG_DIR}/usr/share/applications/com.ashu.desktop.desktop"
            sed -i 's|TryExec=AyuGram|TryExec=ashu-desktop|g' "${PKG_DIR}/usr/share/applications/com.ashu.desktop.desktop"
            sed -i 's|Icon=com.ayugram.desktop|Icon=com.ashu.desktop|g' "${PKG_DIR}/usr/share/applications/com.ashu.desktop.desktop"
          fi

          if [ -f "Telegram/Resources/art/icon512.png" ]; then
            cp "Telegram/Resources/art/icon512.png" "${PKG_DIR}/usr/share/icons/hicolor/512x512/apps/com.ayugram.desktop.png"
            cp "Telegram/Resources/art/icon512.png" "${PKG_DIR}/usr/share/icons/hicolor/512x512/apps/com.ashu.desktop.png"
          fi

          {
            echo "Package: ashu-desktop"
            echo "Version: ${VERSION}"
            echo "Architecture: amd64"
            echo "Maintainer: Ashu <support@ashu.dev>"
            echo "Section: net"
            echo "Priority: optional"
            echo "Depends: libc6 (>= 2.34), libgcc-s1, libstdc++6, libxcb1, libx11-6, libgl1, libglib2.0-0"
            echo "Description: Ashu Desktop client for Linux"
            echo " Desktop version of Ashu - feature-packed Telegram client."
            echo " Auto-updates via APT (GitHub Pages repository)."
          } > "${PKG_DIR}/DEBIAN/control"

          dpkg-deb --build --root-owner-group "${PKG_DIR}"
          mv "build_deb/${PKG_NAME}.deb" "./${PKG_NAME}.deb"

          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "pkg_file=${PKG_NAME}.deb" >> $GITHUB_OUTPUT
          echo "date_str=${DATE_STR}" >> $GITHUB_OUTPUT
        id: build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.pkg_file }}
          path: ${{ steps.build.outputs.pkg_file }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.build.outputs.tag }}
          name: Ashu Desktop Debian Build (${{ steps.build.outputs.date_str }})
          body: |
            Automated Linux Debian package build for Ashu Desktop.

            - **Release Tag:** `${{ steps.build.outputs.tag }}`
            - **Package File:** `${{ steps.build.outputs.pkg_file }}`
            - **Built on:** `${{ steps.build.outputs.date_str }}`

            ### Install & Auto-Update
            ```bash
            sudo dpkg -i ${{ steps.build.outputs.pkg_file }}
            ```
            After install, updates come through APT:
            ```bash
            sudo apt update && sudo apt upgrade
            ```
          files: ${{ steps.build.outputs.pkg_file }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy APT repo to GitHub Pages
        run: |
          sudo apt-get install -y dpkg-dev
          mkdir -p apt-repo
          cp "${{ steps.build.outputs.pkg_file }}" apt-repo/
          cd apt-repo
          dpkg-scanpackages --multiversion . /dev/null > Packages
          gzip -k -f Packages
          apt-ftparchive release . > Release

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apt-repo
          destination_dir: apt
          keep_files: false
